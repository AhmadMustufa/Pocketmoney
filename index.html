<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
var CFG={url:'https://beinbnnbasuwbjgoucnw.supabase.co/rest/v1/',key:'sb_publishable_8ALfqZp79BRAohGkWahB8Q_V1QztIhw'};
var $=function(s){return document.querySelector(s)};
var pad=function(n){return(n<10?'0':'')+n};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
var addDays=function(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)};
var monday=function(d){return addDays(d,-((d.getDay()+6)%7))};
var wks=function(a,b){return Math.round((parse(b)-parse(a))/6048e5)};
var r2=function(n){return Math.round(n*100)/100};
var money=function(n){return 'Rs.'+Number(n).toLocaleString('en-PK',{maximumFractionDigits:2})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var short=function(d){return d.getDate()+' '+MN[d.getMonth()]};
var fullDate=function(d){return DN[(d.getDay()+6)%7]+', '+d.getDate()+' '+MN[d.getMonth()]+' '+d.getFullYear()};
var S={tab:'home',set:{weekly_budget:1000,palette:localStorage.getItem('pal')||'sensei'},cats:[],exp:[],inc:[],sav:[],goals:[],moves:[],pots:[],cat:null,pay:null,flt:'all',wk:0};
var K={v:''},sb,ready=false;
var TABS=[['home','🏠','Home'],['history','🧾','History'],['+'],['stats','📊','Stats'],['savings','🏺','Savings']];

function toast(m){var t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(function(){t.className=''},2600)}
async function q(p){var r=await p;if(r.error){toast(r.error.message);throw r.error}return r.data}
async function run(p,msg){await q(p);await load();if(msg)toast(msg)}
function applyPalette(){document.documentElement.setAttribute('data-p',S.set.palette||'sensei');var m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()}

async function load(){
  var r=await Promise.all([
    q(sb.from('settings').select('*').eq('id',1).single()),
    q(sb.from('categories').select('*').order('sort').order('id')),
    q(sb.from('expenses').select('*').order('spent_on',{ascending:false}).order('id',{ascending:false})),
    q(sb.from('savings').select('*').order('id',{ascending:false})),
    q(sb.from('goals').select('*').order('id',{ascending:false})),
    q(sb.from('income').select('*').order('received_on',{ascending:false}).order('id',{ascending:false})),
    q(sb.from('pots').select('*').order('id')),
    q(sb.from('goal_moves').select('*').order('id',{ascending:false}))
  ]);
  S.set=r[0];S.cats=r[1];S.exp=r[2];S.sav=r[3];S.goals=r[4].filter(function(g){return g.active});S.inc=r[5];S.pots=r[6];S.moves=r[7];
  localStorage.setItem('pal',S.set.palette);
  if(!S.cat||!S.cats.some(function(c){return c.id===S.cat}))S.cat=S.cats.length?S.cats[0].id:null;
  ready=true;applyPalette();render();
}

/* ---------- maths ---------- */
var catOf=function(id){return S.cats.find(function(c){return c.id===id})||{name:'Other',emoji:'💸'}};
var potOf=function(id){return S.pots.find(function(p){return p.id===id})};
var sum=function(a){return a.reduce(function(t,x){return t+Number(x.amount)},0)};
var inRange=function(a,b){return S.exp.filter(function(x){return x.spent_on>=a&&x.spent_on<=b})};
var weekSpent=function(m){return sum(inRange(ymd(m),ymd(addDays(m,6))).filter(function(x){return !x.pot_id}))};
var wdIn=function(a,b){return -sum(S.sav.filter(function(x){var d=ymd(new Date(x.created_at));return Number(x.amount)<0&&x.source!=='goal'&&d>=a&&d<=b}))};
var extraIn=function(a,b){return sum(S.inc.filter(function(x){return x.received_on>=a&&x.received_on<=b}))+wdIn(a,b)};
var commit=function(m){var e=ymd(addDays(m,6));return S.pots.filter(function(p){return p.since<=e}).reduce(function(t,p){return t+Number(p.weekly_amount)},0)};
var weekBudget=function(m){return Number(S.set.weekly_budget)-commit(m)+extraIn(ymd(m),ymd(addDays(m,6)))};
var potAcc=function(p){return Number(p.base)+Number(p.weekly_amount)*(wks(p.anchor,ymd(monday(new Date())))+1)};
var potUsed=function(p){return sum(S.exp.filter(function(x){return x.pot_id===p.id}))};
var potBal=function(p){return potAcc(p)-potUsed(p)};
var goalBal=function(g){return sum(S.moves.filter(function(m){return m.goal_id===g.id}))};
var inGoals=function(){return S.goals.reduce(function(t,g){return t+goalBal(g)},0)};
var freeSav=function(){return sum(S.sav)-inGoals()};
function pend(){
  var mon=monday(new Date()),o=[];
  for(var i=1;i<=4;i++){var m=addDays(mon,-7*i),k=ymd(m),note='Leftover from week of '+k,left=r2(weekBudget(m)-weekSpent(m));
    if(inRange(k,ymd(addDays(m,6))).length&&left>0&&!S.sav.some(function(x){return x.note===note}))o.push({left:left,note:note,m:m})}
  return o;
}

/* ---------- sheets ---------- */

var txt=function(id,v,m,ph){return '<input id="'+id+'" type="text" maxlength="'+m+'" placeholder="'+(ph||'')+'" value="'+esc(v||'')+'">'};
var gv=function(id){return $(id).value.trim()};
function amtBlock(init){
  K.v=init?String(init):'';
  return '<div class="ad" id="ad">Rs.'+(K.v||'0')+'</div><div class="kp">'+['1','2','3','4','5','6','7','8','9','.','0','<'].map(function(k){return '<button onclick="key(\''+k+'\')">'+(k==='<'?'⌫':k)+'</button>'}).join('')+'</div>';
}
function key(k){
  var v=K.v;

    if(a!==Number(p.weekly_amount)){d.base=r2(Number(p.base)+Number(p.weekly_amount)*wks(p.anchor,cur));d.anchor=cur;d.weekly_amount=a}
    done(sb.from('pots').update(d).eq('id',id),'Set-aside updated');
  });
}
function potMgr(){
  sheet('<h2>Weekly set-asides</h2>'+(S.pots.map(function(p){return '<div class="item tap" onclick="viewPot('+p.id+')"><div class="em">'+p.emoji+'</div><div class="t"><span>'+esc(p.name)+'</span><span class="mu sm">'+money(p.weekly_amount)+' / week</span></div><span class="mu">›</span></div>'}).join('')||'<p class="mu" style="margin-bottom:12px">None yet.</p>')+'<button class="btn" onclick="potForm()">New set-aside</button>');
}
function budForm(){
  modal('Weekly budget',amtBlock(S.set.weekly_budget)+'<p class="mu sm" style="margin-bottom:10px">Your total for the week. Set-asides come out of this first.</p>','Save budget',function(){if(!amt())return toast('Enter a budget above 0');done(sb.from('settings').update({weekly_budget:amt()}).eq('id',1),'Budget saved')});
}
function catMgr(){
  sheet('<h2>Categories</h2>'+S.cats.map(function(c){return '<div class="item tap" onclick="catForm('+c.id+')"><div class="em">'+c.emoji+'</div><div class="t">'+esc(c.name)+'</div><span class="mu">Edit ›</span></div>'}).join('')+'<button class="btn" onclick="catForm()">New category</button>');
}
function catForm(id){
  var c=id?S.cats.find(function(e){return e.id===id}):null;
  modal(c?'Edit category':'New category',lb('Emoji')+txt('f1',c&&c.emoji,4,'🙂')+lb('Name')+txt('f2',c&&c.name,24,'Category name'),c?'Save changes':'Add',function(){
    var n=gv('#f2');if(!n)return toast('Enter a category name');
    var d={name:n,emoji:gv('#f1')||'💸'};
    done(c?sb.from('categories').update(d).eq('id',id):sb.from('categories').insert({name:n,emoji:d.emoji,sort:S.cats.length+1}),c?'Category updated':'Category added');
  });
  if(c){var r=document.querySelector('#sheet .row2');r.insertAdjacentHTML('beforebegin','<button class="btn alt" style="margin-bottom:8px" onclick="delCat('+id+')">Delete category</button>')}
}
function delCat(id){ask('Delete category?','Past expenses will show as Other.','Delete',function(){done(sb.from('categories').delete().eq('id',id),'Category deleted')})}

/* ---------- details ---------- */
var btn=function(t,f,c){return '<button class="btn '+(c||'alt')+' sm2" onclick="'+f+'">'+t+'</button>'};
var stamp=function(x){return x.created_at?dr('Added on',fullDate(new Date(x.created_at))):''};
function viewExp(id){
  var x=S.exp.find(function(e){return e.id===id});if(!x)return;var c=catOf(x.category_id),p=x.pot_id?potOf(x.pot_id):null;
  detail('Expense',p?p.emoji:c.emoji,money(x.amount),dr('Category',esc(c.name))+dr('Paid from',p?esc(p.name)+' set-aside':'Weekly money')+dr('Note',x.note?esc(x.note):dash)+dr('Date',fullDate(parse(x.spent_on)))+stamp(x),btn('Edit','editExp('+id+')')+btn('Delete','ask(\'Delete expense?\',\'This can’t be undone.\',\'Delete\',function(){done(sb.from(\'expenses\').delete().eq(\'id\','+id+'),\'Expense deleted\')})','bad'));
}
function editExp(id){
  var x=S.exp.find(function(e){return e.id===id});
  var o='<option value="">💸 Other</option>'+S.cats.map(function(c){return '<option value="'+c.id+'"'+(c.id===x.category_id?' selected':'')+'>'+c.emoji+' '+esc(c.name)+'</option>'}).join('');
  var po='<option value="">💵 Weekly money</option>'+S.pots.map(function(p){return '<option value="'+p.id+'"'+(p.id===x.pot_id?' selected':'')+'>'+p.emoji+' '+esc(p.name)+'</option>'}).join('');
  modal('Edit expense',amtBlock(x.amount)+lb('Category')+'<select id="f2">'+o+'</select>'+lb('Paid from')+'<select id="f5">'+po+'</select>'+txt('f3',x.note,80,'Note')+'<input id="f4" type="date" value="'+x.spent_on+'">','Save changes',function(){
    if(!amt())return toast('Enter an amount above 0');if(!$('#f4').value)return toast('Pick a date');
    done(sb.from('expenses').update({amount:amt(),category_id:parseInt($('#f2').value)||null,pot_id:parseInt($('#f5').value)||null,note:gv('#f3')||null,spent_on:$('#f4').value}).eq('id',id),'Expense updated');
  });
}
function viewInc(id){
  var x=S.inc.find(function(e){return e.id===id});if(!x)return;
  detail('Extra money','💰','<span style="color:var(--a2)">+'+money(x.amount)+'</span>',dr('Where from',x.note?esc(x.note):dash)+dr('Date received',fullDate(parse(x.received_on)))+stamp(x),btn('Edit','editInc('+id+')')+btn('Delete','ask(\'Delete entry?\',\'This lowers that week’s budget.\',\'Delete\',function(){done(sb.from(\'income\').delete().eq(\'id\','+id+'),\'Entry deleted\')})','bad'));
}
function editInc(id){
  var x=S.inc.find(function(e){return e.id===id});
  modal('Edit extra money',amtBlock(x.amount)+txt('f2',x.note,60,'Where from?')+'<input id="f3" type="date" value="'+x.received_on+'">','Save changes',function(){
    if(!amt())return toast('Enter an amount above 0');if(!$('#f3').value)return toast('Pick a date');
    done(sb.from('income').update({amount:amt(),note:gv('#f2')||null,received_on:$('#f3').value}).eq('id',id),'Entry updated');
  });
}
function viewSav(id){
  var x=S.sav.find(function(e){return e.id===id});if(!x)return;var d=new Date(x.created_at),out=Number(x.amount)<0;
  detail('Savings entry',out?'📤':'📥','<span style="color:'+(out?'var(--bad)':'var(--a2)')+'">'+(out?'':'+')+money(x.amount)+'</span>',dr('Type',x.source==='goal'?'Goal paid out':out?'Withdrawn':'Added')+dr('Note',x.note?esc(x.note):dash)+dr('Date',fullDate(d)),btn('Edit','editSav('+id+')')+btn('Delete','delSav('+id+')','bad'));
}
function editSav(id){
  var x=S.sav.find(function(e){return e.id===id}),sg=x.amount<0?-1:1;
  modal('Edit savings entry',amtBlock(Math.abs(x.amount))+txt('f3',x.note,60,'Note'),'Save changes',function(){
    var a=amt();if(!a)return toast('Enter an amount above 0');
    if(freeSav()-Number(x.amount)+sg*a<0)return toast('That would cut into money kept for goals');
    done(sb.from('savings').update({amount:sg*a,note:gv('#f3')||null}).eq('id',id),'Entry updated');
  });
}
function delSav(id){
  var x=S.sav.find(function(e){return e.id===id});
  if(freeSav()-Number(x.amount)<0)return toast('Deleting this would cut into money kept for goals');
  ask('Delete savings entry?','This can’t be undone.','Delete',function(){done(sb.from('savings').delete().eq('id',id),'Entry deleted')});
}
function viewPot(id){
  var p=potOf(id);if(!p)return;var b=potBal(p);
  var l=S.exp.filter(function(x){return x.pot_id===id}).slice(0,4).map(function(x){return dr(esc(x.note||catOf(x.category_id).name)+' · '+short(parse(x.spent_on)),money(x.amount))}).join('');
  detail(esc(p.name),p.emoji,'<span'+(b<0?' style="color:var(--bad)"':'')+'>'+money(b)+'</span>',dr('Set aside each week',money(p.weekly_amount))+dr('Set aside so far',money(potAcc(p)))+dr('Used',money(potUsed(p)))+(l?'<p class="mu sm" style="margin-top:10px">Latest spending</p>'+l:'')+'<button class="btn" style="margin:12px 0 8px" onclick="expForm('+id+')">Spend from this</button>',btn('Edit','potForm('+id+')')+btn('Delete','delPot('+id+')','bad'));
}
function delPot(id){ask('Delete set-aside?','Its balance disappears and past spending from it will count against your weekly money.','Delete',function(){done(sb.from('pots').delete().eq('id',id),'Set-aside deleted')})}
function viewGoal(id){
  var g=S.goals.find(function(x){return x.id===id});if(!g)return;var b=goalBal(g),p=Math.min(100,b/g.target*100);
  var l=S.moves.filter(function(m){return m.goal_id===id}).slice(0,4).map(function(m){return dr(short(new Date(m.created_at)),'<span style="color:'+(m.amount<0?'var(--bad)':'var(--a2)')+'">'+(m.amount>0?'+':'')+money(m.amount)+'</span>')}).join('');
  detail(esc(g.name),g.emoji||'🎯',money(b),'<div class="meter"><i style="width:'+p+'%"></i></div><p class="mu sm" style="text-align:center;margin-bottom:6px">'+(b>=g.target?'Target reached!':money(g.target-b)+' to go of '+money(g.target))+'</p>'+l
   +'<div class="row2" style="margin:12px 0 8px">'+btn('＋ Add money','goalMove('+id+',1)','')+btn('Take back','goalMove('+id+',-1)')+'</div>'
   +'<button class="btn alt sm2" style="margin-bottom:8px" onclick="finishGoal('+id+')">✅ I’ve spent it — close goal</button>',btn('Edit','goalForm('+id+')')+btn('Delete','delGoal('+id+')','bad'));
}
function finishGoal(id){
  var g=S.goals.find(function(x){return x.id===id}),b=goalBal(g);
  ask('Close this goal?',money(b)+' leaves your savings as spent on “'+esc(g.name)+'”. It won’t change your weekly budget.','Close goal',async function(){
    try{if(b>0)await q(sb.from('savings').insert({amount:-b,note:'Goal: '+g.name,source:'goal'}));await q(sb.from('goals').update({active:false}).eq('id',id));await load();closeSheet();toast('Goal closed')}catch(e){}
  });
}
function delGoal(id){var g=S.goals.find(function(x){return x.id===id});ask('Delete goal?',money(goalBal(g))+' goes back to your free savings.','Delete',function(){done(sb.from('goals').delete().eq('id',id),'Goal deleted')})}

/* ---------- start ---------- */
applyPalette();
sb=supabase.createClient(CFG.url.trim().replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,''),CFG.key.trim());
load().catch(function(e){if(!ready)$('#view').innerHTML='<section class="card"><h2>Could not load your data</h2><p class="mu">Check your Supabase URL and key, and that migration.sql has been run.</p><p style="margin-top:12px">Error: '+esc((e&&e.message)||e)+'</p></section>'});
</script>
</body>
</html>
